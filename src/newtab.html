<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Vimdeck</title>
        <link rel="stylesheet" href="newtab.css" />
    </head>
    <body>
        <main class="newtab-shell" aria-label="Vimdeck new tab">
            <section class="command-center" aria-labelledby="newtab-title">
                <header class="newtab-toolbar">
                    <h1 id="newtab-title">Vimdeck</h1>
                    <div class="theme-switch" role="group" aria-label="Theme">
                        <button
                            id="themeDark"
                            type="button"
                            data-theme-value="dark"
                        >
                            Dark
                        </button>
                        <button
                            id="themeLight"
                            type="button"
                            data-theme-value="light"
                        >
                            Light
                        </button>
                    </div>
                </header>

                <form class="search-form" id="searchForm">
                    <label class="search-label" for="searchInput"
                        >Search or open URL</label
                    >
                    <div class="search-row">
                        <span class="prompt" aria-hidden="true">/</span>
                        <input
                            id="searchInput"
                            name="query"
                            type="search"
                            autocomplete="off"
                            spellcheck="false"
                            placeholder="Search web or type a URL"
                        />
                        <button type="submit">Go</button>
                    </div>
                </form>
                <section
                    class="shortcuts-panel"
                    aria-labelledby="shortcuts-title"
                >
                    <div class="panel-heading">
                        <div>
                            <h2 id="shortcuts-title">Shortcuts</h2>
                            <p id="shortcutCount">0 marks</p>
                        </div>
                        <div class="panel-actions">
                            <button
                                class="icon-button"
                                id="toggleShortcutEditing"
                                type="button"
                                aria-label="Edit shortcuts"
                                title="Edit shortcuts"
                                aria-pressed="false"
                            >
                                <svg
                                    class="icon"
                                    xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 640 640"
                                    aria-hidden="true"
                                    focusable="false"
                                >
                                    <path
                                        fill="currentColor"
                                        d="M259.1 73.5C262.1 58.7 275.2 48 290.4 48L350.2 48C365.4 48 378.5 58.7 381.5 73.5L396 143.5C410.1 149.5 423.3 157.2 435.3 166.3L503.1 143.8C517.5 139 533.3 145 540.9 158.2L570.8 210C578.4 223.2 575.7 239.8 564.3 249.9L511 297.3C511.9 304.7 512.3 312.3 512.3 320C512.3 327.7 511.8 335.3 511 342.7L564.4 390.2C575.8 400.3 578.4 417 570.9 430.1L541 481.9C533.4 495 517.6 501.1 503.2 496.3L435.4 473.8C423.3 482.9 410.1 490.5 396.1 496.6L381.7 566.5C378.6 581.4 365.5 592 350.4 592L290.6 592C275.4 592 262.3 581.3 259.3 566.5L244.9 496.6C230.8 490.6 217.7 482.9 205.6 473.8L137.5 496.3C123.1 501.1 107.3 495.1 99.7 481.9L69.8 430.1C62.2 416.9 64.9 400.3 76.3 390.2L129.7 342.7C128.8 335.3 128.4 327.7 128.4 320C128.4 312.3 128.9 304.7 129.7 297.3L76.3 249.8C64.9 239.7 62.3 223 69.8 209.9L99.7 158.1C107.3 144.9 123.1 138.9 137.5 143.7L205.3 166.2C217.4 157.1 230.6 149.5 244.6 143.4L259.1 73.5zM320.3 400C364.5 399.8 400.2 363.9 400 319.7C399.8 275.5 363.9 239.8 319.7 240C275.5 240.2 239.8 276.1 240 320.3C240.2 364.5 276.1 400.2 320.3 400z"
                                    />
                                </svg>
                            </button>
                            <button
                                class="icon-button"
                                id="openShortcutDialog"
                                type="button"
                                aria-label="Add shortcut"
                                title="Add shortcut"
                            >
                                +
                            </button>
                        </div>
                    </div>
                    <div class="shortcut-grid" id="shortcutGrid"></div>
                    <p class="empty-state" id="emptyState">No shortcuts yet.</p>
                </section>

                <dialog
                    class="shortcut-dialog"
                    id="shortcutDialog"
                    aria-labelledby="shortcutDialogTitle"
                >
                    <form class="shortcut-form" id="shortcutForm">
                        <div class="dialog-heading">
                            <h2 id="shortcutDialogTitle">Add Shortcut</h2>
                            <button
                                class="icon-button"
                                id="closeShortcutDialog"
                                type="button"
                                aria-label="Close dialog"
                                title="Close"
                            >
                                x
                            </button>
                        </div>
                        <label>
                            <span>Name</span>
                            <input
                                id="shortcutName"
                                name="name"
                                type="text"
                                autocomplete="off"
                                placeholder="GitHub"
                            />
                        </label>
                        <label>
                            <span>URL</span>
                            <input
                                id="shortcutUrl"
                                name="url"
                                type="text"
                                inputmode="url"
                                autocomplete="off"
                                placeholder="https://github.com"
                            />
                        </label>
                        <div class="dialog-actions">
                            <button
                                class="secondary-button"
                                id="cancelShortcutDialog"
                                type="button"
                            >
                                Cancel
                            </button>
                            <button id="saveShortcut" type="submit">Add</button>
                        </div>
                    </form>
                </dialog>
            </section>
        </main>
        <script src="newtab.js"></script>
        <script src="content.js"></script>
    </body>
</html>
