<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Vimdeck</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <main class="panel">
            <header>
                <h1>Vimdeck</h1>
                <label class="switch">
                    <input id="enabled" type="checkbox" />
                    <span>Enabled</span>
                </label>
            </header>

            <section class="controls">
                <label>
                    <input id="smoothScroll" type="checkbox" />
                    <span>Smooth scroll</span>
                </label>
                <label>
                    <input id="hintsEnabled" type="checkbox" />
                    <span>Link hints</span>
                </label>
            </section>

            <section class="keys" id="keys" aria-label="Mapped keys"></section>

            <a class="options-link" href="../src/options.html" target="_blank"
                >Options</a
            >
        </main>
        <script src="defaults.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
