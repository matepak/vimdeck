<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vimdeck Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>Vimdeck Options</h1>
      <form id="optionsForm">
        <section>
          <h2>Behavior</h2>
          <label>
            <span>Scroll step</span>
            <input id="scrollStep" name="scrollStep" type="number" min="10" max="500" step="10">
          </label>
          <label>
            <span>Half-page ratio</span>
            <input id="halfPageRatio" name="halfPageRatio" type="number" min="0.1" max="1" step="0.1">
          </label>
        </section>

        <section>
          <h2>Keys</h2>
          <div id="keymap" class="keymap"></div>
        </section>

        <footer>
          <button type="submit">Save</button>
          <button id="reset" type="button">Reset</button>
          <span id="status" role="status"></span>
        </footer>
      </form>
    </main>
    <script src="defaults.js"></script>
    <script src="options.js"></script>
  </body>
</html>
