<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vimdeck Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main>
      <h1>Vimdeck Options</h1>
      <form id="optionsForm">
        <section>
          <h2>Appearance</h2>
          <div class="theme-row">
            <span>Theme</span>
            <div class="theme-switch" role="group" aria-label="Theme">
              <button id="themeDark" type="button" data-theme-value="dark">Dark</button>
              <button id="themeLight" type="button" data-theme-value="light">Light</button>
            </div>
          </div>
        </section>

        <section>
          <h2>Behavior</h2>
          <label>
            <span>Scroll step</span>
            <input id="scrollStep" name="scrollStep" type="number" min="10" max="500" step="10">
          </label>
          <label>
            <span>Half-page ratio</span>
            <input id="halfPageRatio" name="halfPageRatio" type="number" min="0.1" max="1" step="0.1">
          </label>
        </section>

        <section>
          <h2>Keys</h2>
          <div id="keymap" class="keymap"></div>
        </section>

        <section>
          <h2>Disabled sites</h2>
          <p class="hint">
            One pattern per line. Key mappings are turned off on matching pages.
            Use a hostname (<code>example.com</code> also matches subdomains),
            <code>*</code> as a wildcard (<code>*.example.com</code>), or include
            a path (<code>example.com/app</code>, <code>github.com/me/*</code>).
          </p>
          <textarea id="disabledSites" name="disabledSites" rows="5"
            spellcheck="false" placeholder="mail.google.com&#10;*.example.com&#10;docs.google.com/document"></textarea>
        </section>

        <footer>
          <button type="submit">Save</button>
          <button id="reset" type="button">Reset</button>
          <span id="status" role="status"></span>
        </footer>
      </form>
    </main>
    <script src="defaults.js"></script>
    <script src="options.js"></script>
  </body>
</html>
